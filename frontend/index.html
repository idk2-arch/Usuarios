<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD Usuarios</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="toast"></div>

  <div class="container">

    <header>
      <div class="logo">👤</div>
      <h1>Gestión de <span>Usuarios</span></h1>
    </header>

    <div class="card" id="form-card">
      <p class="card-title" id="form-titulo">➕ Nuevo Usuario</p>

      <input type="hidden" id="usuario-id" />

      <div class="form-grid">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Ana García" />
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="ana@ejemplo.com" />
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" placeholder="3001234567" />
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary"   id="btn-guardar">💾 Guardar</button>
        <button class="btn-secondary" id="btn-cancelar" style="display:none">✖ Cancelar</button>
      </div>
    </div>

    <div class="card">
      <p class="card-title">📋 Usuarios Registrados</p>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <div class="icon">⏳</div>
                  <p>Cargando usuarios...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
  
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="display:none">
    <div class="modal">
      <div class="modal-icon">🗑️</div>
      <h2 class="modal-title" id="modal-title">Eliminar usuario</h2>
      <p class="modal-msg" id="modal-msg">¿Seguro que quieres eliminar a este usuario? Esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="modal-cancelar">Cancelar</button>
        <button class="btn-danger"    id="modal-confirmar">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/controller.js"></script>

</body>
</html>
